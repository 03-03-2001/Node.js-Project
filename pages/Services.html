<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="Services.css">
</head>
<body>
     <section class="section-services" id="services">
    <div class="row">
      <h1>Our Achievement</h1>
      <div class="col">
        <h3>15+</h3>
        <p>Laundry Services</p>
      </div>
      <div class="col">
        <h3>240+</h3>
        <p>Happy Customer</p>
      </div>
      <div class="col">
        <h3>2+ Yrs</h3>
        <p>Experience</p>
      </div>
    </div>
  </section>


   <div class="section-booking">
    <div class="services">
      <h1>Our Services</h1>

      <div class="service-item">
        <div>
          <span>Dry cleaning - ₹200</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('Dry cleaning', 200)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('Dry cleaning', 200)">
            Remove Now
          </button>
        </div>
      </div>

      <div class="service-item">
        <div>
          <span>Wash & Fold - ₹100</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('Wash & Fold', 100)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('Wash & Fold', 100)">
            Remove Now
          </button>
        </div>
      </div>

      <div class="service-item">
        <div>
          <span>Ironing - ₹30</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('Ironing', 30)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('Ironing', 30)">
            Remove Now
          </button>
        </div>
      </div>
      <div class="service-item">
        <div>
          <span>stain removal- ₹500</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('stain removal', 500)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('stain removal', 30)">
            Remove Now
          </button>
        </div>
      </div>
      <div class="service-item">
        <div>
          <span>Leather& Suede cleaning - ₹999</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('Leather& Suede cleaning', 999)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('Leather& Suede cleaning', 999)">
            Remove Now
          </button>
        </div>
      </div>
      <div class="service-item">
        <div>
          <span>Wedding Dress cleaning - ₹2800</span>
        </div>
        <div class="services button">
          <button class="add" onclick="addItem('Wedding Dress cleaning', 2800)">
            Add Items
          </button>
          <button class="remove" onclick="removeItem('Wedding Dress cleaning', 2800)">
            Remove Now
          </button>
        </div>
      </div>

      <p class="info-text">Add items to the cart</p>
    </div>

    <div class="right-div">
      <div class="cart">
        <h3>Selected Services</h3>
        <div id="cart"></div>
        <div class="total">Total: ₹<span id="total">0</span></div>
      </div>

      <div class="second-div">
        <h2>Book Now</h2>

        <form id="bookingForm">
          <input type="text" id="name" placeholder="Enter Name" required />
          <input type="email" id="email" placeholder="Enter Email" required />
          <button class="btn-book" type="submit" onclick="scrollService()">Book Now</button>
        </form>

        <p id="cartMessage"></p>
      </div>
    </div>
  </div>

    <script  src="script.js"></script>
</body>
</html>
